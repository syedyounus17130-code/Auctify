services:
  - type: web
    name: auctify
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --build-from-source=sqlite3
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
