services:
  - type: web
    name: auctify
    runtime: node
    # Free plan for a college project/demo. Local SQLite data and uploads are ephemeral.
    plan: free
    rootDir: server
    buildCommand: npm ci --build-from-source=sqlite3
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: APP_BASE_URL
        sync: false
