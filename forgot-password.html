<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | AuctFy</title>
    <link rel="stylesheet" href="css/login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container reset-container">
        <section class="left">
            <h1>Reset your password</h1>
            <p>We will email you a secure, one-time link. It expires after 30 minutes.</p>
        </section>
        <section class="right">
            <form id="forgotPasswordForm">
                <h2>Forgot Password?</h2>
                <p>Enter the email address on your AuctFy account.</p>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input id="resetEmail" type="email" placeholder="Email address" autocomplete="email" required>
                </div>
                <button id="sendResetButton" type="submit">Send reset link</button>
                <p id="resetMessage" role="status" aria-live="polite"></p>
                <p><a href="login.html">Back to login</a></p>
            </form>
        </section>
    </div>
    <script src="js/forgot-password.js"></script>
    <script src="js/logout.js"></script>
</body>
</html>
