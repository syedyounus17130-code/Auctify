<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AuctFy</title>

    <link rel="stylesheet" href="css/signup.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

</head>

<body>

<div class="container">

<div class="left">

<h1>AuctFy</h1>

<h2>Create Your Account</h2>

<p>

Join thousands of buyers and sellers.

Create your first auction FREE.

Upgrade later for unlimited auctions.

</p>

<img src="https://images.unsplash.com/photo-1556740749-887f6717d7e4?w=800">

</div>

<div class="right">

<form id="signupForm">

<h2>Sign Up</h2>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="name"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-phone"></i>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

<div class="terms">

<input type="checkbox" required>

<label>

I agree to the Terms & Conditions

</label>

</div>

<button type="submit">

Create Account

</button>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</form>

</div>

</div>

<script src="js/signup.js"></script>

    <script src="js/logout.js"></script>
</body>

</html>
