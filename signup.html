<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AuctFy</title>

    <link rel="stylesheet" href="css/signup.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

</head>

<body>

<div class="container">

<div class="left">

<h1>AuctFy</h1>

<h2>Create Your Account</h2>

<p>

Join thousands of buyers and sellers.

Create your first auction FREE.

Upgrade later for unlimited auctions.

</p>

<img src="https://images.unsplash.com/photo-1556740749-887f6717d7e4?w=800">

</div>

<div class="right">

<form id="signupForm">
    <h2>Create your account</h2>

    <div id="signupDetails">
        <div class="input-box">
            <i class="fa-solid fa-user" aria-hidden="true"></i>
            <input type="text" id="name" placeholder="Full Name" autocomplete="name" maxlength="100" required>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            <input type="email" id="email" placeholder="Email address" autocomplete="email" required>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-phone" aria-hidden="true"></i>
            <input type="tel" id="phone" placeholder="Phone Number" autocomplete="tel" maxlength="30" required>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            <input type="password" id="password" placeholder="Password (at least 8 characters)" autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>

        <div class="terms">
            <input type="checkbox" id="termsAccepted" required>
            <label for="termsAccepted">I agree to the Terms &amp; Conditions</label>
        </div>

        <button type="submit" id="signupSubmit">Create Account</button>
    </div>

    <p id="signupStatus" class="signup-status" role="status" aria-live="polite"></p>
    <p class="account-prompt">Already have an account? <a href="login.html">Log in</a></p>
</form>

</div>

</div>

<script src="js/signup.js"></script>

    <script src="js/logout.js"></script>
</body>

</html>
