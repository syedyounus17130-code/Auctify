<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AuctFy</title>

    <link rel="stylesheet" href="css/login.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="left">

        <h1>Welcome Back!</h1>

        <p>
            Sign in to manage your auctions, place bids, and discover exciting deals on AuctFy.
        </p>

        <img src="https://images.unsplash.com/photo-1556740749-887f6717d7e4?w=800" alt="Auction">

    </div>

    <div class="right">

        <form id="loginForm">

            <h2>Login</h2>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="forgot-password.html">Forgot Password?</a>

            </div>

            <button type="submit">

                Login

            </button>

            <p>

                Don't have an account?

                <a href="signup.html">Sign Up</a>

            </p>

        </form>

    </div>

</div>

<script src="js/login.js"></script>

    <script src="js/logout.js"></script>
</body>

</html>
