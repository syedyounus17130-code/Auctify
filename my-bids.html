<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Bids | AuctFy</title>

    <link
        rel="stylesheet"
        href="css/my-bids.css"
    >
    <link rel="stylesheet" href="css/app-sidebar.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

</head>

<body>

    <div class="container">

        <h1>My Bids</h1>

        <p class="subtitle">
            Auctions where you have placed bids
        </p>


        <div id="loading">
            Loading your bids...
        </div>


        <div
            id="bidsContainer"
            class="bids-container"
        ></div>


        <p
            id="noBids"
            class="no-bids"
            style="display:none;"
        >
            You haven't placed any bids yet.
        </p>

    </div>


    <script src="js/my-bids.js"></script>
    <script src="js/app-sidebar.js"></script>

    <script src="js/logout.js"></script>
</body>

</html>
