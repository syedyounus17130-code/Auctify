<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a New Password | AuctFy</title>
    <link rel="stylesheet" href="css/login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container reset-container">
        <section class="left">
            <h1>Choose a new password</h1>
            <p>Use at least 8 characters. The reset link can be used once.</p>
        </section>
        <section class="right">
            <form id="resetPasswordForm">
                <h2>New Password</h2>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input id="newPassword" type="password" placeholder="New password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input id="confirmPassword" type="password" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>
                </div>
                <button id="resetPasswordButton" type="submit">Update password</button>
                <p id="resetMessage" role="status" aria-live="polite"></p>
                <p><a href="login.html">Back to login</a></p>
            </form>
        </section>
    </div>
    <script src="js/reset-password.js"></script>
    <script src="js/logout.js"></script>
</body>
</html>
